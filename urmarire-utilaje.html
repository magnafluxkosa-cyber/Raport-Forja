<!doctype html>
<html lang="ro" class="rf-acl-pending">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URMĂRIRE UTILAJE - K.A.D</title>
  <script src="./rf-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./rf-app-registry.js?v=20261002-urmarire-utilaje"></script>
  <script src="./auth-common.js"></script>
  <link rel="stylesheet" href="./mobile-erp.css" />
  <link rel="stylesheet" href="./kad-nav-shell.css" />
  <style>
    :root{
      --bg:#b7d7f0;--panel:#d7e8f7;--white:#fff;--line:#111827;--text:#0f172a;--muted:#475569;
      --blue:#2b6cb0;--blue2:#1e5a96;--header:#d8f0cd;--title:#b9dff0;--weekend:#b9dff0;
      --inactive:#b30009;--total:#d8f0cd;--shadow:0 10px 25px rgba(0,0,0,.10);--purple:#6d28d9;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg)}
    body{overflow:hidden}
    html.rf-acl-pending body{visibility:hidden!important}
    html.rf-acl-ready body,html.rf-acl-denied body{visibility:visible!important}
    .app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px}
    .panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;min-height:62px}
    .title{font-size:27px;font-weight:900;letter-spacing:.35px}
    .subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-weight:800}
    .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    button{height:38px;border:2px solid var(--line);background:var(--blue);color:#fff;border-radius:10px;padding:0 13px;font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap}
    button:hover{background:var(--blue2)}
    button.secondary{background:#e2e8f0;color:var(--text)}
    button.secondary:hover{background:#cbd5e1}
    button:disabled{opacity:.55;cursor:not-allowed}
    .controls{display:flex;align-items:end;gap:10px;flex-wrap:wrap;padding:10px 12px}
    .field{display:flex;flex-direction:column;gap:4px;min-width:155px}
    .field label{font-size:12px;font-weight:900;color:#1f2937}
    .field select{height:38px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:14px;font-weight:800;color:var(--text);outline:none}
    .rule{min-height:38px;display:flex;align-items:center;padding:7px 11px;background:#fff;border:2px solid var(--line);border-radius:10px;font-size:12px;font-weight:900;color:#334155;flex:1;min-width:300px}
    .content{flex:1;min-height:0;display:flex;flex-direction:column}
    .table-panel{flex:1;min-height:0;padding:10px;display:flex;flex-direction:column;gap:7px}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#334155;font-weight:800;min-height:20px}
    .meta .bad{color:#991b1b}.meta .ok{color:#166534}
    .table-wrap{flex:1;min-height:0;overflow:auto;border:2px solid var(--line);background:#fff;scrollbar-gutter:stable both-edges}
    table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px;font-variant-numeric:tabular-nums}
    th,td{border-right:1px solid #111;border-bottom:1px solid #111;text-align:center;padding:0;height:34px;white-space:nowrap}
    thead th{position:sticky;z-index:8;font-weight:900}
    thead tr:first-child th{top:0;height:36px}
    thead tr:nth-child(2) th{top:36px;height:32px}
    .month-title{background:var(--title);font-size:18px;min-width:370px}
    .weekday,.dayno{background:var(--header);min-width:48px;width:48px}
    .weekday.weekend,.dayno.weekend{background:var(--weekend)}
    .line-head{background:#f8fafc;font-size:14px}
    .total-head{background:var(--total);min-width:78px;width:78px}
    .group-cell{min-width:145px;width:145px;background:#fff;font-size:14px;font-weight:900;padding:0 7px;position:sticky;left:0;z-index:5}
    .machine-cell{min-width:225px;width:225px;background:#fff;text-align:left;padding:0 8px;font-size:14px;font-weight:900;position:sticky;left:145px;z-index:5}
    .total-cell{min-width:78px;width:78px;background:var(--total);font-size:14px;font-weight:900;position:sticky;left:370px;z-index:5}
    thead .sticky-a{position:sticky;left:0;z-index:12}
    thead .sticky-b{position:sticky;left:145px;z-index:12}
    thead .sticky-c{position:sticky;left:370px;z-index:12}
    .day-cell{min-width:48px;width:48px;font-size:13px;font-weight:900;background:#fff}
    .day-cell.zero-weekday{background:var(--inactive);color:transparent}
    .day-cell.zero-weekend{background:var(--weekend);color:transparent}
    .day-cell.active{background:#fff;color:#111}
    tbody tr.group-end td{border-bottom:4px double #111}
    tbody tr:hover .machine-cell,tbody tr:hover .group-cell,tbody tr:hover .total-cell{filter:brightness(.97)}
    .empty-cell{padding:18px!important;text-align:center!important;background:#fff!important;font-weight:900;color:#475569}
    .denied{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
    .denied-card{width:min(650px,100%);background:rgba(255,255,255,.42);border:3px solid rgba(0,0,0,.75);border-radius:20px;padding:28px;text-align:center}
    .denied-card h1{margin:0 0 8px;color:#991b1b}.denied-card p{font-weight:800;color:#334155}
    .denied-card a{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border:2px solid #000;border-radius:11px;background:#fff;color:#0f172a;text-decoration:none;font-weight:900}
    @media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100%}.table-panel{min-height:600px}.rule{min-width:100%}}
    @media(max-width:620px){.topbar{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.title{font-size:23px}.controls{align-items:stretch}.field{min-width:calc(50% - 5px);flex:1}.rule{min-width:100%}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar panel">
      <div>
        <div class="title">URMĂRIRE UTILAJE</div>
        <div class="subtitle">Ore calculate automat din FORJATE, TRATAMENT TERMIC, MAGNAFLUX și DEBITATE.</div>
      </div>
      <div class="actions">
        <button class="secondary" id="btnBack" type="button">Înapoi la Dashboard</button>
        <button id="btnRefresh" type="button">Reîncarcă</button>
      </div>
    </div>

    <div class="controls panel">
      <div class="field">
        <label for="yearSelect">An</label>
        <select id="yearSelect"></select>
      </div>
      <div class="field">
        <label for="monthSelect">Lună</label>
        <select id="monthSelect"></select>
      </div>
      <div class="rule">Regulă: 1 schimb distinct = 8 ore · 2 schimburi = 16 ore · 3 schimburi = 24 ore. Același schimb este numărat o singură dată pe utilaj și zi.</div>
    </div>

    <div class="content">
      <div class="table-panel panel">
        <div class="meta">
          <div id="statusText">Se citesc datele din cloud...</div>
          <div id="updatedText"></div>
        </div>
        <div class="table-wrap">
          <table id="trackingTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  const PAGE_KEY = 'urmarire-utilaje';
  const MONTHS = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
  const WEEKDAYS = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
  const FALLBACK_MACHINES = {
    forja:['Linia 5 T CHINA','LINIA 1,25','LINIA 2,5','LINIA 3T ZARNESTI'],
    magnaflux:['Kriope 2000','Kriope 6000'],
    debitare:['SCPK 1','SCPK 2','EVERESING']
  };
  const SOURCE_GROUPS = ['forja','tratament','magnaflux','debitare'];
  const DISPLAY_GROUPS = [
    {label:'FORJA',sources:['forja']},
    {label:'TT/Magnaflux',sources:['tratament','magnaflux']},
    {label:'Debitare',sources:['debitare']}
  ];
  const $ = id => document.getElementById(id);
  const state = {
    sb:null,user:null,role:'viewer',canView:false,helpers:null,
    sources:{forja:[],tratament:[],magnaflux:[],debitare:[]},
    known:{forja:new Map(),tratament:new Map(),magnaflux:new Map(),debitare:new Map()},
    data:new Map(),latestUpdated:'',realtime:null,reloadTimer:null
  };

  function clean(value){ return String(value == null ? '' : value).replace(/\s+/g,' ').trim(); }
  function norm(value){
    return clean(value).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'');
  }
  function esc(value){
    return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function pick(obj,names){
    if(!obj || typeof obj !== 'object') return '';
    for(const name of names){ if(obj[name] !== undefined && obj[name] !== null && obj[name] !== '') return obj[name]; }
    const entries = Object.entries(obj).map(([k,v]) => [norm(k),v]);
    for(const name of names){
      const wanted = norm(name);
      const found = entries.find(([k,v]) => k === wanted && v !== undefined && v !== null && v !== '');
      if(found) return found[1];
    }
    return '';
  }
  function getPayload(doc){ return doc ? (doc.content ?? doc.data ?? null) : null; }
  function extractRows(payload){
    if(!payload) return [];
    if(Array.isArray(payload)) return payload;
    for(const key of ['rows','items','records','values','entries','data']) if(Array.isArray(payload[key])) return payload[key];
    return [];
  }
  function extractSheets(payload){
    if(!payload || typeof payload !== 'object') return [];
    return Array.isArray(payload.sheets) ? payload.sheets : [];
  }
  function excelSerialDate(serial){
    const n = Number(serial); if(!Number.isFinite(n)) return null;
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    return Number.isNaN(d.getTime()) ? null : new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  }
  function parseDateAny(value){
    if(value instanceof Date && !Number.isNaN(value.getTime())) return new Date(Date.UTC(value.getFullYear(),value.getMonth(),value.getDate()));
    if(typeof value === 'number') return excelSerialDate(value);
    const s = clean(value); if(!s) return null;
    if(/^\d+(\.\d+)?$/.test(s) && Number(s) > 25000) return excelSerialDate(Number(s));
    let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if(m) return new Date(Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])));
    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
    if(m){ let y=Number(m[3]); if(y<100)y+=2000; return new Date(Date.UTC(y,Number(m[2])-1,Number(m[1]))); }
    const d = new Date(s); return Number.isNaN(d.getTime()) ? null : new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  }
  function dateParts(date){ return date ? {year:date.getUTCFullYear(),month:date.getUTCMonth()+1,day:date.getUTCDate()} : null; }
  function shiftNo(value){
    const s = clean(value); if(!s) return 0;
    const direct = Number(s); if(Number.isInteger(direct) && direct >= 1 && direct <= 3) return direct;
    const m = s.match(/(?:SCHIMB(?:UL)?|SHIFT)?\s*[-:]?\s*([123])\b/i);
    return m ? Number(m[1]) : 0;
  }
  function machineKey(value){ return norm(value); }
  function machineLabel(value){ return clean(value); }
  function monthDays(year,month){ return new Date(Date.UTC(year,month,0)).getUTCDate(); }
  function isWeekend(year,month,day){ const wd=new Date(Date.UTC(year,month-1,day)).getUTCDay(); return wd===0 || wd===6; }
  function displayDateTime(iso){
    if(!iso) return '';
    const d=new Date(iso); if(Number.isNaN(d.getTime())) return '';
    return d.toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }

  function getConfig(){
    const c=window.RF_CONFIG||window.rfConfig||window.__RF_CONFIG__||{};
    return {url:c.SUPABASE_URL||c.supabaseUrl||'',key:c.SUPABASE_ANON_KEY||c.supabaseAnonKey||''};
  }
  function getSupabase(){
    try{ if(window.ERPAuth&&typeof window.ERPAuth.getSupabaseClient==='function'){ const c=window.ERPAuth.getSupabaseClient(); if(c)return c; } }catch(_e){}
    if(window.__RF_SHARED_SUPABASE__) return window.__RF_SHARED_SUPABASE__;
    const cfg=getConfig();
    if(!cfg.url||!cfg.key||!(window.supabase&&window.supabase.createClient)) return null;
    window.__RF_SHARED_SUPABASE__=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    return window.__RF_SHARED_SUPABASE__;
  }
  async function resolveStrictAccess(){
    if(!window.ERPAuth || typeof window.ERPAuth.getCurrentUserWithRole!=='function') return false;
    const auth=await window.ERPAuth.getCurrentUserWithRole();
    state.user=auth&&auth.user||null; state.role=clean(auth&&auth.role||'viewer').toLowerCase();
    if(!state.user) return false;
    let permissions=null;
    if(typeof window.ERPAuth.getPageAccess==='function'){
      try{
        const access=await window.ERPAuth.getPageAccess(PAGE_KEY,{user:state.user,role:state.role});
        permissions=access&&access.permissions?access.permissions:access;
      }catch(_e){}
    }
    state.canView=!!(permissions&&permissions.can_view===true);
    return state.canView;
  }
  function renderDenied(){
    document.documentElement.classList.remove('rf-acl-pending','rf-acl-ready');
    document.documentElement.classList.add('rf-acl-denied');
    document.body.innerHTML='<div class="denied"><div class="denied-card"><h1>Acces restricționat</h1><p>Nu există permisiune <b>can_view</b> pentru pagina URMĂRIRE UTILAJE. Accesul direct prin URL este blocat.</p><a href="index.html">Înapoi la Dashboard</a></div></div>';
  }
  function revealPage(){ document.documentElement.classList.remove('rf-acl-pending','rf-acl-denied'); document.documentElement.classList.add('rf-acl-ready'); }

  async function queryExact(keys){
    const list=Array.from(new Set((keys||[]).filter(Boolean))); if(!list.length)return [];
    const {data,error}=await state.sb.from('rf_documents').select('doc_key,content,data,updated_at').in('doc_key',list);
    if(error) throw error; return Array.isArray(data)?data:[];
  }
  function latestIso(docs){
    return (docs||[]).reduce((max,doc)=>String(doc&&doc.updated_at||'')>max?String(doc.updated_at):max,'');
  }

  function normalizeForjaRow(raw){
    if(Array.isArray(raw)) return {date:parseDateAny(raw[2]),machine:machineLabel(raw[4]),shift:shiftNo(raw[3])};
    return {
      date:parseDateAny(pick(raw,['data','date','DATA','Date'])),
      machine:machineLabel(pick(raw,['ciocan','CIOCAN','utilaj','UTILAJ','echipament','ECHIPAMENT','linie','LINIE'])),
      shift:shiftNo(pick(raw,['schimb','schimbul','SCHIMB','SCHIMBUL','shift']))
    };
  }
  function normalizeTreatmentRow(raw){
    if(Array.isArray(raw)) return {date:parseDateAny(raw[2]),machine:'Tratament termic',shift:shiftNo(raw[3])};
    return {
      date:parseDateAny(pick(raw,['data','date','DATA','Date'])),
      machine:'Tratament termic',
      shift:shiftNo(pick(raw,['schimbul','schimb','SCHIMBUL','SCHIMB','shift']))
    };
  }
  function normalizeMagnafluxRow(raw){
    if(Array.isArray(raw)) return {date:parseDateAny(raw[2]),machine:machineLabel(raw[27]||raw.utilaj||''),shift:shiftNo(raw[28]||raw.schimb||'')};
    return {
      date:parseDateAny(pick(raw,['data','date','DATA','Date'])),
      machine:machineLabel(pick(raw,['utilaj','UTILAJ','echipament','ECHIPAMENT','machine','Masina'])),
      shift:shiftNo(pick(raw,['schimb','schimbul','SCHIMB','SCHIMBUL','shift']))
    };
  }
  function normalizeDebitareRow(raw){
    if(Array.isArray(raw)) return {date:parseDateAny(raw[2]),machine:machineLabel(raw[3]),shift:shiftNo(raw[12])};
    return {
      date:parseDateAny(pick(raw,['data','date','DATA','Date'])),
      machine:machineLabel(pick(raw,['echipament','Echipament','utilaj','UTILAJ','linie','LINIE'])),
      shift:shiftNo(pick(raw,['schimbul','schimb','SCHIMBUL','SCHIMB','shift']))
    };
  }

  function helperItems(value){
    if(!Array.isArray(value)) return [];
    return value.map(item=>{
      if(typeof item==='string'||typeof item==='number') return clean(item);
      if(!item||typeof item!=='object') return '';
      return clean(item.label??item.value??item.name??item.nume??item.utilaj??item.echipament??item.code??'');
    }).filter(Boolean);
  }
  function addKnown(group,label){
    const display=machineLabel(label),key=machineKey(display); if(!key)return;
    if(!state.known[group].has(key)) state.known[group].set(key,display);
  }
  function seedKnownMachines(){
    Object.values(state.known).forEach(map=>map.clear());
    const h=state.helpers||{};
    helperItems(h.utilaje_forja).forEach(x=>addKnown('forja',x));
    helperItems(h.utilaje_debitare).forEach(x=>addKnown('debitare',x));
    addKnown('tratament','Tratament termic');

    state.sources.forja.forEach(r=>addKnown('forja',r.machine));
    state.sources.magnaflux.forEach(r=>addKnown('magnaflux',r.machine));
    state.sources.debitare.forEach(r=>addKnown('debitare',r.machine));

    if(!state.known.forja.size) FALLBACK_MACHINES.forja.forEach(x=>addKnown('forja',x));
    if(!state.known.magnaflux.size) FALLBACK_MACHINES.magnaflux.forEach(x=>addKnown('magnaflux',x));
    if(!state.known.debitare.size) FALLBACK_MACHINES.debitare.forEach(x=>addKnown('debitare',x));
  }

  async function loadSources(){
    const year=Number($('yearSelect').value||new Date().getFullYear());
    $('statusText').textContent='Se citesc datele pentru '+year+'...';
    const docs=await queryExact([
      'helpers','forjate','forjate:'+year,'tratament-termic-rapoarte',
      'magnaflux:'+year,'magnaflux','magnaflux:operatori-fise',
      'debitate:'+year,'debitate'
    ]);
    const byKey=new Map(docs.map(doc=>[String(doc.doc_key||''),doc]));
    const helperDoc=byKey.get('helpers'); state.helpers=getPayload(helperDoc)||{};

    const forjaRows=[];
    ['forjate','forjate:'+year].forEach(key=>extractRows(getPayload(byKey.get(key))).forEach(raw=>{ const r=normalizeForjaRow(raw); if(r.date&&r.machine&&r.shift) forjaRows.push(r); }));
    const treatmentRows=[];
    extractRows(getPayload(byKey.get('tratament-termic-rapoarte'))).forEach(raw=>{ const r=normalizeTreatmentRow(raw); if(r.date&&r.shift) treatmentRows.push(r); });
    const magnaRows=[];
    ['magnaflux:'+year,'magnaflux'].forEach(key=>extractRows(getPayload(byKey.get(key))).forEach(raw=>{ const r=normalizeMagnafluxRow(raw); if(r.date&&r.machine&&r.shift) magnaRows.push(r); }));
    extractSheets(getPayload(byKey.get('magnaflux:operatori-fise'))).forEach(raw=>{ const r=normalizeMagnafluxRow(raw); if(r.date&&r.machine&&r.shift) magnaRows.push(r); });
    const debitRows=[];
    ['debitate:'+year,'debitate'].forEach(key=>extractRows(getPayload(byKey.get(key))).forEach(raw=>{ const r=normalizeDebitareRow(raw); if(r.date&&r.machine&&r.shift) debitRows.push(r); }));

    state.sources={forja:forjaRows,tratament:treatmentRows,magnaflux:magnaRows,debitare:debitRows};
    state.latestUpdated=latestIso(docs);
    seedKnownMachines();
    calculate();
    $('updatedText').textContent=state.latestUpdated?'Ultima sursă actualizată: '+displayDateTime(state.latestUpdated):'';
  }

  function calculate(){
    const year=Number($('yearSelect').value||new Date().getFullYear());
    const month=Number($('monthSelect').value||new Date().getMonth()+1);
    state.data=new Map();
    for(const groupKey of SOURCE_GROUPS){
      const rows=state.sources[groupKey]||[];
      rows.forEach(row=>{
        const p=dateParts(row.date); if(!p||p.year!==year||p.month!==month||!row.shift||!row.machine)return;
        const mk=machineKey(row.machine); if(!mk)return;
        addKnown(groupKey,row.machine);
        const key=groupKey+'|'+mk+'|'+p.day;
        if(!state.data.has(key)) state.data.set(key,new Set());
        state.data.get(key).add(row.shift);
      });
    }
    renderTable(year,month);
  }

  function machineRows(groupKey){
    const map=state.known[groupKey]||new Map();
    return Array.from(map.entries()).map(([key,label])=>({key,label,sourceKey:groupKey})).sort((a,b)=>a.label.localeCompare(b.label,'ro',{numeric:true,sensitivity:'base'}));
  }
  function displayMachineRows(displayGroup){
    const rows=[];
    (displayGroup.sources||[]).forEach(sourceKey=>rows.push(...machineRows(sourceKey)));
    return rows;
  }
  function hoursFor(groupKey,machineKeyValue,day){
    const set=state.data.get(groupKey+'|'+machineKeyValue+'|'+day); return set ? set.size*8 : 0;
  }
  function renderTable(year,month){
    const days=monthDays(year,month);
    let row1='<tr><th colspan="3" class="month-title sticky-a">'+esc(MONTHS[month-1]+' '+year)+'</th>';
    for(let day=1;day<=days;day++){
      const wd=new Date(Date.UTC(year,month-1,day)).getUTCDay();
      row1+='<th class="weekday '+((wd===0||wd===6)?'weekend':'')+'">'+esc(WEEKDAYS[wd])+'</th>';
    }
    row1+='</tr>';
    let row2='<tr><th colspan="2" class="line-head sticky-a">Linie utilaj</th><th class="total-head sticky-c">Total ore</th>';
    for(let day=1;day<=days;day++) row2+='<th class="dayno '+(isWeekend(year,month,day)?'weekend':'')+'">'+day+'</th>';
    row2+='</tr>';
    $('tableHead').innerHTML=row1+row2;

    const parts=[];
    let totalMachines=0,totalHours=0;
    for(const group of DISPLAY_GROUPS){
      const machines=displayMachineRows(group); if(!machines.length) continue;
      totalMachines+=machines.length;
      machines.forEach((machine,index)=>{
        let total=0; const cells=[];
        for(let day=1;day<=days;day++){
          const hours=hoursFor(machine.sourceKey,machine.key,day); total+=hours;
          const weekend=isWeekend(year,month,day);
          const cls=hours>0?'active':(weekend?'zero-weekend':'zero-weekday');
          cells.push('<td class="day-cell '+cls+'">'+(hours>0?hours:'')+'</td>');
        }
        totalHours+=total;
        const groupCell=index===0?'<td class="group-cell" rowspan="'+machines.length+'">'+esc(group.label)+'</td>':'';
        parts.push('<tr class="'+(index===machines.length-1?'group-end':'')+'">'+groupCell+'<td class="machine-cell">'+esc(machine.label)+'</td><td class="total-cell">'+total+'</td>'+cells.join('')+'</tr>');
      });
    }
    if(!parts.length) parts.push('<tr><td class="empty-cell" colspan="'+(3+days)+'">Nu există utilaje disponibile pentru afișare.</td></tr>');
    $('tableBody').innerHTML=parts.join('');
    $('statusText').innerHTML='<span class="ok">'+esc(MONTHS[month-1]+' '+year)+'</span> · '+totalMachines+' utilaje · '+totalHours+' ore calculate';
  }

  function fillSelectors(){
    const now=new Date(),currentYear=now.getFullYear();
    const years=[]; for(let y=currentYear-5;y<=currentYear+1;y++) years.push(y);
    $('yearSelect').innerHTML=years.map(y=>'<option value="'+y+'">'+y+'</option>').join('');
    $('monthSelect').innerHTML=MONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+esc(m)+'</option>').join('');
    $('yearSelect').value=String(currentYear); $('monthSelect').value=String(now.getMonth()+1);
  }
  function subscribeRealtime(){
    try{
      if(!state.sb||!state.sb.channel)return;
      if(state.realtime){ try{state.sb.removeChannel(state.realtime);}catch(_e){} }
      state.realtime=state.sb.channel('urmarire_utilaje_sources')
        .on('postgres_changes',{event:'*',schema:'public',table:'rf_documents'},payload=>{
          const key=String(payload&&payload.new&&payload.new.doc_key||payload&&payload.old&&payload.old.doc_key||'');
          if(!/^(helpers|forjate(?::|$)|tratament-termic-rapoarte$|magnaflux(?::|$)|debitate(?::|$))/.test(key)) return;
          clearTimeout(state.reloadTimer); state.reloadTimer=setTimeout(()=>loadSources().catch(console.error),650);
        }).subscribe();
    }catch(_e){}
  }

  async function init(){
    try{
      const allowed=await resolveStrictAccess(); if(!allowed){renderDenied();return;}
      state.sb=getSupabase(); if(!state.sb) throw new Error('Supabase indisponibil.');
      revealPage(); fillSelectors(); await loadSources(); subscribeRealtime();
    }catch(error){
      console.error(error); revealPage(); $('statusText').innerHTML='<span class="bad">Nu am putut încărca sursele: '+esc(error&&error.message||error)+'</span>';
    }
  }

  $('btnBack').addEventListener('click',()=>location.href='index.html');
  $('btnRefresh').addEventListener('click',async()=>{ $('btnRefresh').disabled=true; try{await loadSources();}catch(error){console.error(error);$('statusText').innerHTML='<span class="bad">Eroare la reîncărcare: '+esc(error&&error.message||error)+'</span>';}finally{$('btnRefresh').disabled=false;} });
  $('yearSelect').addEventListener('change',()=>loadSources().catch(console.error));
  $('monthSelect').addEventListener('change',calculate);
  window.addEventListener('beforeunload',()=>{ try{if(state.realtime&&state.sb)state.sb.removeChannel(state.realtime);}catch(_e){} });
  init();
})();
</script>
<script src="./kad-nav-shell.js"></script>
</body>
